description = "Create a new Final POS app from a description and build it end to end."

prompt = """
Build a new Final POS app. The user's brief: {{args}}

If the brief is empty, ask what they want to build (concept, hardware target
such as tablet/kiosk/terminal/mobile, and any branding preferences) before
touching any tools.

Then run the build loop from the Final playbook:

1. get_connection — confirm the build pack is allowed (find_tools if Flow tools
   are not listed).
2. flow_get_scaffold — learn the app contract.
3. flow_create_flow — name it after the concept; keep the returned flowId for
   every later call, and share the builder link with the user.
4. flow_log_message (role "user") with the brief above.
5. Plan the screens. Check flow_search_blueprints and adapt matches via
   flow_get_blueprint. Ground EVERY renderClient call with
   flow_lookup_command_frame before writing it — never guess.
6. flow_write_flow_files — full file contents, app code under src/, entry
   src/App.tsx.
7. flow_validate_flow — fix every finding and re-validate until clean.
8. flow_start_preview — give the user the live preview URL.

Finish by summarizing what was built, the preview URL, and the builder link.
"""
