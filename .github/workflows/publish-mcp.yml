name: Publish to MCP Registry

# The registry entries, each published only when its version is not live yet:
#  - com.finalpos/final              server.json                      the Final MCP gateway (ai.finalpos.com/mcp)
#  - com.finalpos.build/final-flows  legacy/final-flows/server.json   Flow's direct endpoint, kept for sk_ keys
# Both use DNS auth on finalpos.com (MCP_PRIVATE_KEY repo secret + the
# "v=MCPv1; ..." TXT record on the apex). Runs on every push to main that
# touches an entry, so a merged version bump is live without a tag.
#
# io.github.Final-Commerce/final-docs (GitHub OIDC) is retired: it pointed at a
# public docs server that no longer exists (mcp.finalpos.com is Final OS's
# keyed staff server). The retire job hides any version still listed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server.json", "legacy/**", ".github/workflows/publish-mcp.yml"]
    tags: ["v*"]

jobs:
  publish-finalpos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (DNS, finalpos.com)
        run: ./mcp-publisher login dns --domain finalpos.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish com.finalpos entries
        run: |
          set -euo pipefail
          for dir in . legacy/final-flows; do
            NAME=$(jq -r .name "$dir/server.json")
            VER=$(jq -r .version "$dir/server.json")
            LATEST=$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" | jq -r --arg n "$NAME" '.servers[] | select(.server.name == $n) | select(._meta."io.modelcontextprotocol.registry/official".isLatest) | .server.version')
            echo "$NAME latest=$LATEST current=$VER"
            if [ "$LATEST" = "$VER" ]; then echo "skip $NAME"; continue; fi
            (cd "$dir" && "$GITHUB_WORKSPACE/mcp-publisher" publish)
          done

  retire-final-docs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Skip if nothing is listed
        id: check
        run: |
          NAME=io.github.Final-Commerce/final-docs
          LISTED=$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" | jq --arg n "$NAME" '[.servers[] | select(.server.name == $n) | select(._meta."io.modelcontextprotocol.registry/official".status != "deleted")] | length')
          echo "listed=$LISTED"
          if [ "$LISTED" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: steps.check.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Retire final-docs
        if: steps.check.outputs.skip == 'false'
        run: |
          ./mcp-publisher status --status deleted --all-versions --yes \
            --message "Retired. Use com.finalpos/final (https://ai.finalpos.com/mcp)." \
            io.github.Final-Commerce/final-docs
