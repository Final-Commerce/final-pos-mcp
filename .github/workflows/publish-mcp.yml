name: Publish to MCP Registry

# Publishes the final-docs server under io.github.Final-Commerce/* via GitHub OIDC.
# The main final-flows server is registered as com.finalpos.build/final-flows
# (domain-verified namespace) — republishing it requires the com.finalpos.build
# auth key, not GitHub OIDC, so it is not published from CI. server.json at the
# repo root documents that canonical entry.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish final-docs server
        run: cd docs-server && ../mcp-publisher publish
