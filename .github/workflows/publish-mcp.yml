name: Publish to MCP Registry

# Three registry entries, each published only when its version is not live yet:
#  - com.finalpos/final              server.json                      the Final MCP gateway (ai.finalpos.com/mcp)
#  - com.finalpos.build/final-flows  legacy/final-flows/server.json   Flow's direct endpoint, kept for sk_ keys
#  - io.github.Final-Commerce/final-docs  docs-server/server.json     the docs MCP server
# The com.finalpos.* entries use DNS auth on finalpos.com (MCP_PRIVATE_KEY repo
# secret + the "v=MCPv1; ..." TXT record on the apex); final-docs uses GitHub OIDC.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish-finalpos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (DNS, finalpos.com)
        run: ./mcp-publisher login dns --domain finalpos.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish com.finalpos entries
        run: |
          set -euo pipefail
          for dir in . legacy/final-flows; do
            NAME=$(jq -r .name "$dir/server.json")
            VER=$(jq -r .version "$dir/server.json")
            LATEST=$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" | jq -r --arg n "$NAME" '.servers[] | select(.server.name == $n) | select(._meta."io.modelcontextprotocol.registry/official".isLatest) | .server.version')
            echo "$NAME latest=$LATEST current=$VER"
            if [ "$LATEST" = "$VER" ]; then echo "skip $NAME"; continue; fi
            (cd "$dir" && "$GITHUB_WORKSPACE/mcp-publisher" publish)
          done

  publish-final-docs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Skip if version already published
        id: check
        run: |
          NAME=$(jq -r .name docs-server/server.json)
          VER=$(jq -r .version docs-server/server.json)
          LATEST=$(curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=${NAME}" | jq -r '.servers[] | select(.server.name == "'"$NAME"'") | select(._meta."io.modelcontextprotocol.registry/official".isLatest) | .server.version')
          echo "latest=$LATEST current=$VER"
          if [ "$LATEST" = "$VER" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: steps.check.outputs.skip == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish final-docs server
        if: steps.check.outputs.skip == 'false'
        run: cd docs-server && ../mcp-publisher publish
