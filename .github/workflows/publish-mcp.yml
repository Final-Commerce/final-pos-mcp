name: Publish to MCP Registry

# Two independent jobs:
#  - final-flows: com.finalpos.build/final-flows via DNS auth on finalpos.com
#    (requires the MCP_PRIVATE_KEY repo secret + the "v=MCPv1; ..." TXT record
#    on finalpos.com; apex DNS verification covers com.finalpos.* namespaces)
#  - final-docs: io.github.Final-Commerce/final-docs via GitHub OIDC

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish-final-flows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (DNS, finalpos.com)
        run: ./mcp-publisher login dns --domain finalpos.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish final-flows server
        run: ./mcp-publisher publish

  publish-final-docs:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish final-docs server
        run: cd docs-server && ../mcp-publisher publish
